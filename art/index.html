<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e6e0" />
    <title>Movement · 2016–2025</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%235FE3C3'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <main class="workspace">
      <section class="stage" aria-label="Artwork preview">
        <div class="paper"><canvas id="artwork" role="img" aria-label="Sporting activity from 2016 through 2025. Ten columns of years, fifty-three rows of weeks; colored circles show daily hours of rowing, weight training, cycling, and running."></canvas></div>
      </section>
      <aside class="controls" aria-label="Artwork controls">
        <header><span class="eyebrow">ARTWORK STUDIO</span><button id="preview" class="text-button">Preview ↗</button></header>
        <div class="intro"><h1>Movement</h1><p>2016 — 2025 <span>·</span> A1</p></div>
        <section class="control-section">
          <div class="section-heading"><h2>Palette</h2><button id="reset-palette" class="text-button">Reset</button></div>
          <div id="palette-presets" role="group" aria-label="Palette presets"></div>
          <div class="random-palette">
            <label class="select-row"><span>Color mood</span><select id="color-mood"><option value="auto">Surprise me</option><option value="muted">Muted</option><option value="neon">Neon</option><option value="high-contrast">High contrast</option></select></label>
            <button id="randomize-colors">Randomize colors <span aria-hidden="true">↻</span></button>
            <p id="palette-note" class="control-hint" role="status"></p>
          </div>
          <div id="palette"></div>
          <div class="paper-colors">
            <label>Paper<input id="background" type="color" aria-label="Paper color" /></label>
            <label>Week points<input id="centers" type="color" aria-label="Week point color" /></label>
            <label>Legend<input id="ink" type="color" aria-label="Legend text color" /></label>
          </div>
        </section>
        <section class="control-section">
          <h2>Composition</h2>
          <label class="toggle" title="Place each circle's inner edge on the base ring around the week."><span>Anchor circles to week</span><input id="anchor-circles" type="checkbox" role="switch" /></label>
          <label class="toggle"><span>Stack mixed sport</span><input id="stack-mixed" type="checkbox" role="switch" /></label>
          <p id="mixed-help" class="control-hint"></p>
          <div id="sliders"></div>
          <label class="select-row"><span>Blending</span><select id="blend"></select></label>
        </section>
        <section class="control-section inspect-section">
          <label class="toggle"><span>Inspect weeks</span><input id="inspect" type="checkbox" role="switch" /></label>
          <p id="inspection" aria-live="polite">Turn on to explore the marks.</p>
        </section>
        <footer>
          <button id="export-pdf" class="primary">Export A1 PDF <span>↓</span></button>
          <div class="secondary-actions"><button id="export-png">PNG</button><button id="save-settings">Save settings</button><button id="load-settings">Load settings</button></div>
          <input id="settings-file" type="file" accept="application/json,.json" hidden />
          <div class="footer-row"><button id="reset-all" class="text-button">Reset all</button><span>594 × 841 mm</span></div>
          <p id="status" role="status" aria-live="polite"></p>
        </footer>
      </aside>
    </main>
    <button id="edit" hidden>Edit artwork ↙</button>
  </body>
</html>
